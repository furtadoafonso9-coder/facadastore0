<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FACADA STORE</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #050505; --red: #f4112c; --card: #0d0c11; --border: #22222c; }
        body { background: var(--bg); color: white; font-family: 'Montserrat', sans-serif; margin: 0; }
        
        .container { max-width: 1200px; margin: 0 auto; padding: 100px 5%; }
        .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; }

        /* EFEITO INTERATIVO */
        .portfolio-card { 
            background: var(--card); 
            border: 1px solid var(--border); 
            border-radius: 14px; 
            overflow: hidden; 
            transition: all 0.4s ease; 
            position: relative;
        }
        
        /* HOVER COM GLOW VERMELHO */
        .portfolio-card:hover { 
            border-color: var(--red); 
            transform: translateY(-10px); 
            box-shadow: 0 0 20px rgba(244, 17, 44, 0.3); 
        }

        .media { height: 180px; overflow: hidden; }
        .media img { width: 100%; height: 100%; object-fit: cover; transition: 0.5s; }
        .portfolio-card:hover .media img { transform: scale(1.1); }
        
        .info { padding: 20px; }
        .btn-ver { color: var(--red); font-size: 12px; font-weight: 700; text-transform: uppercase; cursor: pointer; }
    </style>
</head>
<body>

<div class="container">
    <h2 style="margin-bottom: 30px;">PORTFÓLIO</h2>
    <div class="grid-4">
        <!-- 1 -->
        <div class="portfolio-card">
            <div class="media"><img src="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=600" alt="Servidor"></div>
            <div class="info">
                <h4>Servidor de Comunidade</h4>
                <p style="font-size: 12px; color: #888; margin: 10px 0;">Sistema de cargos</p>
                <div class="btn-ver">VER DETALHES →</div>
            </div>
        </div>
        <!-- 2 -->
        <div class="portfolio-card">
            <div class="media"><img src="https://images.unsplash.com/photo-1542751371-adc38448a05e?q=80&w=600" alt="Bot"></div>
            <div class="info">
                <h4>Bot Multifuncional</h4>
                <p style="font-size: 12px; color: #888; margin: 10px 0;">Comandos avançados</p>
                <div class="btn-ver">VER DETALHES →</div>
            </div>
        </div>
        <!-- 3 -->
        <div class="portfolio-card">
            <div class="media"><img src="https://images.unsplash.com/photo-1550745165-9bc0b252726f?q=80&w=600" alt="Site"></div>
            <div class="info">
                <h4>Landing Page Moderna</h4>
                <p style="font-size: 12px; color: #888; margin: 10px 0;">Design responsivo</p>
                <div class="btn-ver">VER DETALHES →</div>
            </div>
        </div>
        <!-- 4 -->
        <div class="portfolio-card">
            <div class="media"><img src="https://images.unsplash.com/photo-1526374965328-7f61d4dc18c5?q=80&w=600" alt="Loja"></div>
            <div class="info">
                <h4>Loja Online</h4>
                <p style="font-size: 12px; color: #888; margin: 10px 0;">Checkout integrado</p>
                <div class="btn-ver">VER DETALHES →</div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
